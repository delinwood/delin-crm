<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>客户管理 CRM</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14284b">
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"><div class="loading">加载中 Loading…</div></div>
<div id="toast" class="toast"></div>
<script src="js/config.js"></script>
<script src="js/constants.js"></script>
<script>
  // Load mode-specific dependencies, then the app.
  (function () {
    var s = [];
    if (CRM_CONFIG.MODE === 'supabase') s.push('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js');
    else s.push('js/seed.js');
    s.push('js/markets.js', 'js/templates.js', 'js/data.js', 'js/core.js', 'js/followup.js', 'js/mail-merge.js', 'js/v_clients.js', 'js/v_home.js', 'js/v_prospect.js', 'js/v_tools.js', 'js/v_mail.js');
    (function next() { if (!s.length) return UI.route(); var el = document.createElement('script'); el.src = s.shift(); el.onload = next; document.body.appendChild(el); })();
  })();
</script>
</body>
</html>
